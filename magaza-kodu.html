    en[k[1]] = k[1] === "duvar" ? +e.target.value : sayi(e.target.value);
    sifirla(); guncelle(); return true;
  }
  $("mg-dw").addEventListener("click", function (e) {
    if (e.target.id === "mg-egekle") {
      var T = AYAR.engelTipleri.kolon, dv = S.kapi.duvar === 0 && S.duzen > 1 ? 1 : 0;
      S.engeller.push({ duvar: dv, tip: "kolon", x: Math.max(0, Math.round((S.duvarlar[dv].w - T.g) / 2)), g: T.g, d: T.d, h: 0 });
      sifirla(); duvarKutulari(); guncelle();
    }
    if (e.target.dataset.egsil !== undefined) { S.engeller.splice(+e.target.dataset.egsil, 1); sifirla(); duvarKutulari(); guncelle(); }
  });
  $("mg-dw").addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset.eg && t.tagName === "INPUT") { engelAyar(e); return; }
    if (t.dataset.dw !== undefined) { S.duvarlar[+t.dataset.dw].w = sayi(t.value); sifirla(); guncelle(); }
    if (t.id === "mg-kg") { S.kapi.g = sayi(t.value); sifirla(); guncelle(); }
    if (t.id === "mg-kx") { S.kapi.x = sayi(t.value); sifirla(); guncelle(); }
  });
  $("mg-dw").addEventListener("change", function (e) {
    if (e.target.dataset.eg && e.target.tagName === "SELECT") { engelAyar(e); return; }
    if (e.target.dataset.dt !== undefined) { S.duvarlar[+e.target.dataset.dt].tip = e.target.value; sifirla(); guncelle(); return; }
    if (e.target.id !== "mg-kd") return;
    S.kapi.duvar = +e.target.value;
    if (S.kapi.duvar >= 0) {
      var dw = S.duvarlar[S.kapi.duvar].w;
      S.kapi.x = Math.max(0, Math.round((dw - S.kapi.g) / 2));
      $("mg-kx").value = S.kapi.x;
    }
    sifirla(); guncelle();
  });
  R.addEventListener("change", function (e) {
    if (e.target.name === "mg-kp") { S.kaplama = e.target.value; kaplamaSecimi(); guncelle(); }
    if (e.target.name === "mg-dkp") { S.dekorKaplama = e.target.value; kaplamaSecimi(); guncelle(); }
    if (e.target.name === "mg-rr") { S.rafRenk = e.target.value; kaplamaSecimi(); guncelle(); }
    if (e.target.name === "mg-md") {
      S.model = e.target.value; modelSecimi();
      if (S.yer) S.yer.forEach(function (d) { d.forEach(function (u) { u.forEach(function (x) { x.m = S.model; }); }); });
      guncelle();
    }
    if (e.target.tagName === "SELECT" && e.target.dataset.dm !== undefined && e.target.value) {
      S.yer[+e.target.dataset.dm].forEach(function (u) { u.forEach(function (x) { x.m = e.target.value; }); }); guncelle();
    }
    if (e.target.tagName === "SELECT" && e.target.dataset.u !== undefined) {
      S.yer[+e.target.dataset.i][+e.target.dataset.p][+e.target.dataset.u].m = e.target.value; guncelle();
    }
  });
  function menuKapat() { var m = R.querySelector(".mg-pop"); if (m) m.remove(); }
  // ---- basılı tut + sürükle: ünite aynı duvar bölümünde başka bir sıraya taşınır
  var SR = null, sonSurukleme = 0;
  function srTemizle() {
    if (!SR) return;
    clearTimeout(SR.zaman);
    R.querySelectorAll(".mg-tas, .mg-hedef").forEach(function (x) { x.classList.remove("mg-tas"); x.classList.remove("mg-hedef"); });
    SR = null;
  }
  function hedefBul(e) {
    var el = document.elementFromPoint(e.clientX, e.clientY), h = el && el.closest ? el.closest(".mg-hit") : null;
    if (!h || h.dataset.i !== SR.h.dataset.i || h.dataset.p !== SR.h.dataset.p) return null;
    return h;
  }
  R.addEventListener("pointerdown", function (e) {
    var h = e.target.closest(".mg-hit");
    if (!h || (e.pointerType === "mouse" && e.button !== 0)) return;
    srTemizle();
    SR = { h: h, x: e.clientX, y: e.clientY, aktif: false, hedef: null };
    SR.zaman = setTimeout(function () {
      if (!SR) return;
      SR.aktif = true; menuKapat();
      h.classList.add("mg-tas");
      if (navigator.vibrate) try { navigator.vibrate(30); } catch (x) {}
    }, 350);
  });
  R.addEventListener("pointermove", function (e) {
    if (!SR) return;
    if (!SR.aktif) {   // basılı tutma süresi dolmadan parmak kaydıysa sayfa kaydırılıyordur: sürükleme iptal
      if (Math.abs(e.clientX - SR.x) + Math.abs(e.clientY - SR.y) > 10) srTemizle();
      return;
    }
    e.preventDefault();
    var h = hedefBul(e);
    if (SR.hedef && SR.hedef !== h) SR.hedef.classList.remove("mg-hedef");
    if (h && h !== SR.h) h.classList.add("mg-hedef");
    SR.hedef = h && h !== SR.h ? h : null;
  });
  // dokunmatik ekranda sürüklerken sayfa kaymasın
  R.addEventListener("touchmove", function (e) { if (SR && SR.aktif) e.preventDefault(); }, { passive: false });
  R.addEventListener("contextmenu", function (e) { if (e.target.closest(".mg-hit")) e.preventDefault(); });
  function srBitir(e) {
    if (!SR) return;
    if (SR.aktif) {
      sonSurukleme = Date.now();
      var h = SR.hedef || (e && e.type === "pointerup" ? hedefBul(e) : null);
      if (h && h !== SR.h) {
        var l = S.yer[+SR.h.dataset.i][+SR.h.dataset.p], u = l.splice(+SR.h.dataset.u, 1)[0];
        l.splice(+h.dataset.u, 0, u);
        srTemizle(); guncelle(); return;
      }
    }
    srTemizle();
  }
  R.addEventListener("pointerup", srBitir);
  R.addEventListener("pointercancel", srBitir);
  R.addEventListener("click", function (e) {
    if (Date.now() - sonSurukleme < 500) return;   // sürükleme bittiğinde model menüsü açılmasın
    var hit = e.target.closest(".mg-hit"), sec = e.target.closest(".mg-pop button");
    if (sec) {
      var pop = sec.closest(".mg-pop");
      S.yer[+pop.dataset.i][+pop.dataset.p][+pop.dataset.u].m = sec.dataset.m;
      menuKapat(); guncelle(); return;
    }
    menuKapat();
    if (hit) {
      var u = S.yer[+hit.dataset.i][+hit.dataset.p][+hit.dataset.u], kr = R.getBoundingClientRect();
      var m = document.createElement("div");
      m.className = "mg-pop";
      m.dataset.i = hit.dataset.i; m.dataset.p = hit.dataset.p; m.dataset.u = hit.dataset.u;
      m.innerHTML = "<b>" + u.g + " cm ünite · model seçin</b>" + Object.keys(AYAR.modeller).map(function (k, j) {
        return '<button type="button" data-m="' + k + '"' + (k === u.m ? ' class="on"' : "") + ">" + (j + 1) + ". " + AYAR.modeller[k].ad + "</button>";
      }).join("");
      R.appendChild(m);
      var x = e.clientX - kr.left, y = e.clientY - kr.top;
      m.style.left = Math.max(0, Math.min(x, R.clientWidth - m.offsetWidth)) + "px";
      m.style.top = y + 8 + "px";
      return;
    }
    var bt = e.target.closest("button[data-g]");
    if (!bt || !R.contains(bt)) return;
    var u = S.yer[+bt.dataset.i][+bt.dataset.p], g = +bt.dataset.g, son = -1;
    u.forEach(function (x, k) { if (x.g === g) son = k; });
    if (+bt.dataset.d > 0) {
      var yer = son >= 0 ? son + 1 : (g === G()[0] ? 0 : u.length);   // büyükler başta kalsın
      u.splice(yer, 0, { g: g, m: S.model });
    } else if (son >= 0) u.splice(son, 1);
    // adet değişince dizilim yeniden simetrik kurulur (90 cm ortalanabiliyorsa ortada); ünitelerin modelleri korunur
    var sira = {}; u.forEach(function (x) { (sira[x.g] = sira[x.g] || []).push(x.m); });
    var yeni = uniteListesi(sayilar(u), S.model);
    yeni.forEach(function (x) { if (sira[x.g] && sira[x.g].length) x.m = sira[x.g].shift(); });
    u.length = 0; yeni.forEach(function (x) { u.push(x); });
    guncelle();
  });
  $("mg-pdf").addEventListener("click", function () {
    if (!window.AcarRafTeklifTopla) { alert("PDF özelliği bu sayfada yüklenemedi."); return; }
    window.AcarRafTeklifTopla(R, "Mağaza Sistemleri", mesaj(), { duvar: ".mg-dv", toplam: "#mg-tt", plan: "#mg-plan", etiket: "Toplam" + KDV });
  });
  $("mg-wa").addEventListener("click", function () { window.open("https://wa.me/" + AYAR.whatsapp + "?text=" + encodeURIComponent(mesaj()), "_blank"); });

  $("mg-3db").addEventListener("click", uc3Ac);
  $("mg-3ds").addEventListener("click", function () { U3.kameraTamam = false; uc3Kur(); });
  duvarKutulari();
  modelSecimi();
  kaplamaSecimi();
  guncelle();
})();
</script>
